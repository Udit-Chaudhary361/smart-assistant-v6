{% extends "base.html" %}
{% block content %}

<h2>Ask AI Anything</h2>

<form method="post">
    <input
        type="text"
        name="user_prompt"
        placeholder="Enter Prompt Here">
    <button type="submit">Send</button>
</form>
<br>
<div>
    {% if user_prompt %}
        <strong>Question:</strong> {{ user_prompt }}
        <hr>
        <h4>Response:</h4>
        <p>{{ response }}</p>
    {% endif %}
</div>

{% if error: %}
    {{ error }}
{% endif %}

<hr>
<form action="{{ url_for('home') }}">
    <button type="submit">
        Go To Home Page
    </button>
</form>

{% endblock %}
